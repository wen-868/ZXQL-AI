name: CI

# 触发：PR 与 main 推送
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消旧运行（省 Actions 配额，不影响结论）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install / lint / build / test
    runs-on: ubuntu-latest
    # 必须阻断：任一 step 失败即 PR 不可合并（不得 continue-on-error）
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # ⚠️ 顺序要求：pnpm 必须先于 setup-node 的 cache:'pnpm' 安装——
      #   setup-node 计算 pnpm 缓存键时会调用 pnpm store path，
      #   pnpm 不存在则该step 直接失败（run 37487422867 实测）。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 20：NestJS 11 要求 >= 20
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # 迁移索引键长度静态检查（阻断）：InnoDB 索引键 3072 字节上限
      #   起因：生产 Auto Deploy 连续 9 次红于 migrations/022_ai_notice.sql
      #         —— KEY idx_ai_notice_receiver (tenant_id, receiver)，(36+1000)×4=4144>3072
      #         ⇒ ERROR 1071 Specified key was too long（只有真 MySQL 才暴露，本地/CI 提前拦）
      #   纯 Node 标准库脚本，零依赖，故置于 install 之前快速失败；exit 1 即不可合并
      - name: 迁移索引键长度检查（InnoDB 3072 上限）
        run: node scripts/check-index-key-length.cjs

      - name: 依赖安装（frozen-lockfile）
        run: pnpm install --frozen-lockfile

      # lint 只检查不改写（package.json 的 lint 脚本带 --fix，CI 不可用）
      - name: Lint（--max-warnings=0，零容忍）
        run: pnpm exec eslint "src/**/*.ts" --max-warnings=0

      - name: 类型检查（tsc --noEmit）
        run: pnpm exec tsc -p tsconfig.build.json --noEmit

      # 全量类型检查（含 *.spec.ts）：tsconfig.build.json 的 exclude 含 `**/*spec.ts`，
      #   ⇒ spec 里的类型错误在 CI 里**不可见**（2026-10-22 审查 F-1：
      #   readiness.module.spec.ts 的 TS2345 长期漏网，本地 `tsc -p tsconfig.json` 才红）。
      #   与上面一步**并存**：build 口径继续管产物，本步补齐 spec 可见性。
      - name: 类型检查（全量，含 spec）
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: 构建（nest build）
        run: pnpm run build

      # 门禁按全量，不认子集；--runInBand 避免 CI 内存压力导致 OOM
      - name: 单元测试（全量）
        run: pnpm exec jest --ci --runInBand --silent