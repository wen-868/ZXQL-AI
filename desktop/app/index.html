<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智享AI · 独立AI底座桌面软件</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%232563EB" d="M12 2.6l2.05 6.1a2 2 0 0 0 1.25 1.25L21.4 12l-6.1 2.05a2 2 0 0 0-1.25 1.25L12 21.4l-2.05-6.1a2 2 0 0 0-1.25-1.25L2.6 12l6.1-2.05a2 2 0 0 0 1.25-1.25z"/></svg>'>
<style>
:root{
  --bg:#FFFFFF; --side:#F9FAFB; --panel2:#F4F6F8; --ink:#16181D; --sub:#8A8F98; --line:#ECEEF1;
  --blue:#2563EB; --blue-l:#EFF4FF; --grad:linear-gradient(135deg,#3B82F6,#2563EB);
  --amber:#D97706; --amber-bg:#FFFBF0; --amber-line:#F1E3C8; --amber-ink:#92400E;
  --red:#DC2626; --green:#16A34A;
  --shadow:0 8px 30px rgba(22,24,29,.06);
}
[data-theme="dark"]{
  --bg:#0E0F12; --side:#0A0B0D; --panel2:#17181D; --ink:#ECECF1; --sub:#8B8D96; --line:#232529;
  --blue:#5B8DEF; --blue-l:#18233B; --grad:linear-gradient(135deg,#3B82F6,#2563EB);
  --amber:#E8A33D; --amber-bg:#211A0C; --amber-line:#3A2F17; --amber-ink:#F0C179;
  --red:#F87171; --green:#34D399;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
.ic{display:block;flex-shrink:0}
i[data-ic]{display:inline-flex;align-items:center;flex-shrink:0}

.app{display:flex;height:100vh;max-width:1400px;margin:0 auto;background:var(--bg);box-shadow:0 0 80px rgba(0,0,0,.08)}

/* ═══ 侧栏（窄·可折叠） ═══ */
.side{width:230px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin .25s;flex-shrink:0}
.side.hide{margin-left:-230px}
.newchat{margin:14px 14px 6px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px}
.newchat:hover{border-color:var(--blue);color:var(--blue)}
.sess-list{flex:1;overflow-y:auto;padding:6px 10px}
.sess-list::-webkit-scrollbar{width:4px}
.sess-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.sess{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;font-size:12.5px;color:var(--sub);cursor:pointer;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess i{opacity:.7}
.sess:hover{background:var(--panel2);color:var(--ink)}
.sess.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.sess.on i{opacity:1}
.user-card{margin:12px;padding:10px 12px;border-radius:12px;display:flex;align-items:center;gap:9px}
.user-card .av{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.user-card .n{font-size:12.5px;font-weight:600}
.user-card .r{font-size:10.5px;color:var(--sub);margin-top:1px}

/* ═══ 主区 ═══ */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:50px;display:flex;align-items:center;gap:10px;padding:0 18px;flex-shrink:0}
.top .icon-btn{width:32px;height:32px;border-radius:9px;border:none;background:transparent;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.top .icon-btn:hover{background:var(--panel2);color:var(--ink)}
.top .name{font-size:14px;font-weight:700;letter-spacing:.3px}
.top .rt{margin-left:auto;display:flex;align-items:center;gap:4px}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.pulse-dot.off{background:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.15)}

/* ═══ 对话区（居中流式） ═══ */
.chat-scroll{flex:1;overflow-y:auto}
.chat-scroll::-webkit-scrollbar{width:5px}
.chat-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.chat-col{max-width:720px;margin:0 auto;padding:16px 28px 24px;display:flex;flex-direction:column;gap:22px}

/* 功能区 / 对话区 分隔条 */
.divider{display:flex;align-items:center;gap:10px;margin:-4px 0;color:var(--sub)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.divider i{color:var(--sub);opacity:.85}
.divider span{font-size:10.5px;letter-spacing:3px;opacity:.85;user-select:none}

.m-user{align-self:flex-end;max-width:72%;background:var(--blue-l);color:var(--ink);padding:11px 17px;border-radius:20px 20px 5px 20px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.m-ai{display:flex;gap:13px}
.m-ai .av{width:30px;height:30px;border-radius:9px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.m-ai .bd{flex:1;min-width:0;font-size:14px;line-height:1.75;padding-top:4px;word-break:break-word}
.m-ai .bd b{font-weight:700}
.typing::after{content:'▍';animation:blink 1s infinite;color:var(--blue)}
@keyframes blink{50%{opacity:0}}

/* 工具执行（轻量时间线） */
.tl{margin:10px 0 2px}
.tl-sum{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);cursor:pointer;user-select:none;padding:3px 0}
.tl-sum .ok{color:var(--green);font-weight:700;display:inline-flex;align-items:center}
.tl-sum .arr{display:inline-flex;align-items:center;opacity:.7;transition:.2s}
.tl.open .arr{transform:rotate(90deg)}
.tl-items{display:none;margin-top:6px;padding-left:2px}
.tl.open .tl-items{display:block}
.tl-item{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--sub);padding:3.5px 0;border-left:1.5px solid var(--line);padding-left:14px;margin-left:4px;position:relative}
.tl-item::before{content:'';position:absolute;left:-3.5px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--line)}
.tl-item.done::before{background:var(--green)}
.tl-item.fail::before{background:var(--red)}
.tl-item .t{margin-left:auto;font-size:11px;color:var(--sub);opacity:.7}
.spin{width:11px;height:11px;border:1.5px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:rot .7s linear infinite;display:inline-block;flex-shrink:0}
@keyframes rot{to{transform:rotate(360deg)}}

/* 写确认卡（唯一强调元素） */
.confirm{margin:10px 0 4px;background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:16px;padding:15px 17px;max-width:560px;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.confirm .hd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--amber-ink)}
.confirm .hd .timer{margin-left:auto;font-size:11px;font-weight:500;background:rgba(217,119,6,.1);padding:2px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.confirm table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.confirm td{padding:4.5px 0}
.confirm td.k{color:var(--sub);width:86px}
.confirm td.amt{font-size:17px;font-weight:800}
.confirm .sum{margin-top:6px;font-size:12.5px;color:var(--amber-ink)}
.confirm .bar{margin-top:11px;height:3px;border-radius:9px;background:rgba(217,119,6,.15);overflow:hidden}
.confirm .bar i{display:block;height:100%;background:var(--amber);transition:width 1s linear}
.confirm .note{margin-top:10px;font-size:11.5px;color:var(--amber-ink);opacity:.85;display:flex;align-items:center;gap:6px}
.confirm .acts{display:flex;gap:9px;margin-top:13px}
.btn{padding:8.5px 0;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;border:1px solid var(--line);background:var(--bg);color:var(--sub);flex:1;transition:.15s}
.btn:hover{color:var(--ink)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700;flex:1.3}
.btn.pri:hover{filter:brightness(1.06);color:#fff}
.confirm.ok{background:var(--panel2);border-color:var(--line)}
.confirm.ok .hd{color:var(--green)}
.confirm.ok .bar,.confirm.ok .timer{display:none}
.confirm.dead{opacity:.5;filter:grayscale(.7)}
.confirm.dead .acts{pointer-events:none}

/* 表格卡 */
.rtbl{margin:10px 0;max-width:560px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rtbl .ct{font-size:13px;font-weight:700;padding:12px 15px 9px;display:flex;align-items:center;gap:7px}
.rtbl table{width:100%;border-collapse:collapse;font-size:12px}
.rtbl th{text-align:left;color:var(--sub);font-weight:500;padding:8px 15px;background:var(--panel2);border-top:1px solid var(--line)}
.rtbl td{padding:9px 15px;border-top:1px solid var(--line)}

/* 澄清卡 */
.clarify{margin:10px 0;max-width:560px;display:flex;flex-direction:column;gap:8px}
.clarify .q{font-size:13px;line-height:1.6}
.clarify .opts{display:flex;flex-wrap:wrap;gap:8px}
.clarify .opt{padding:7px 14px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;cursor:pointer;color:var(--ink);background:var(--bg);transition:.15s;font-family:inherit}
.clarify .opt:hover{border-color:var(--blue);color:var(--blue)}

/* ═══ 输入区 ═══ */
.input-zone{flex-shrink:0;padding:6px 28px 18px}
.input-box{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:26px;padding:9px 9px 9px 20px;box-shadow:var(--shadow);background:var(--bg);transition:.2s}
.input-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3.5px rgba(37,99,235,.1)}
.input-box textarea{flex:1;border:none;background:transparent;resize:none;outline:none;font-size:14px;font-family:inherit;color:var(--ink);padding:7px 0;max-height:120px;line-height:1.55}
.input-box textarea::placeholder{color:var(--sub)}
.send{width:36px;height:36px;border-radius:50%;background:var(--grad);border:none;color:#fff;cursor:pointer;flex-shrink:0;transition:.2s;display:flex;align-items:center;justify-content:center}
.send .ic{margin:0 0 1.5px 1.5px}
.send:hover{transform:scale(1.06)}
.send:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hint{max-width:720px;margin:9px auto 0;text-align:center;font-size:11px;color:var(--sub);opacity:.75}

/* ═══ 设置抽屉 ═══ */
.mask{position:fixed;inset:0;background:rgba(10,12,16,.35);opacity:0;pointer-events:none;transition:.25s;z-index:50}
.mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-380px;width:360px;height:100vh;background:var(--bg);border-left:1px solid var(--line);transition:right .3s cubic-bezier(.32,.72,.24,1);z-index:51;display:flex;flex-direction:column}
.drawer.show{right:0}
.dr-hd{display:flex;align-items:center;padding:18px 22px 14px;font-size:15px;font-weight:700}
.dr-hd .x{margin-left:auto}
.dr-bd{flex:1;overflow-y:auto;padding:0 22px 22px}
.dr-sec{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:1px;margin:18px 0 8px}
.dr-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.dr-row .k{color:var(--sub);width:76px;flex-shrink:0}
.dr-row .v{flex:1}
.dr-row .ok{color:var(--green);font-size:12px;font-weight:600}
.dr-input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-family:inherit;background:var(--bg);color:var(--ink);outline:none;transition:.15s}
.dr-input:focus{border-color:var(--blue)}
.loginbtn{width:100%;padding:9px;border-radius:10px;border:none;background:var(--grad);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px;transition:.15s}
.loginbtn:hover{filter:brightness(1.06)}
.loginbtn:disabled{opacity:.5;cursor:not-allowed}
.loginbtn.out{background:var(--panel2);color:var(--sub);border:1px solid var(--line);font-weight:500}
.badge{font-size:11px;padding:2px 10px;border-radius:99px}
.badge.on{background:rgba(22,163,74,.12);color:var(--green);font-weight:600}
.badge.off{background:rgba(220,38,38,.1);color:var(--red);font-weight:600}
.model{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;transition:.15s}
.model:hover{border-color:var(--blue)}
.model .nm{font-size:13px;font-weight:600}
.model .sz{font-size:11px;color:var(--sub);margin-top:1px}
.model .tag{margin-left:auto;font-size:11px;padding:3px 12px;border-radius:99px;color:var(--sub)}
.model .tag.on{background:var(--blue-l);color:var(--blue);font-weight:700}
.lockcard{margin-top:10px;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.65;background:var(--panel2);border:1px solid var(--line)}
.lockcard b{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:12.5px}
.lockcard.g b{color:var(--green)}
.lockcard.b b{color:var(--blue)}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--bg);font-size:12.5px;padding:9px 22px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:760px){.side{position:fixed;z-index:40;height:100vh}.side.hide{margin-left:-230px}}

/* ═══ 无边框窗口（Codex 风格）· 仅追加 ═══ */
body.native{padding:0;background:var(--bg)}
body.native .app{border-radius:0;border:none;box-shadow:none;max-width:none}
body:not(.native){display:flex;align-items:center;justify-content:center;padding:34px;background:radial-gradient(1100px 640px at 50% -8%,#2A3040,#14161C 72%)}
body:not(.native) .app{height:calc(100vh - 68px);max-height:920px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.09);box-shadow:0 40px 90px rgba(0,0,0,.55);position:relative}
.top{-webkit-app-region:drag}
.top .icon-btn,.top .rt,.top .rt *{-webkit-app-region:no-drag}
.winbtns{display:flex;align-items:center;gap:2px;margin-left:10px}
.winbtn{width:30px;height:26px;border:none;background:transparent;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:.15s}
.winbtn:hover{background:var(--panel2);color:var(--ink)}
.winbtn.close:hover{background:var(--red);color:#fff}
body.native .mask,body.native .drawer{position:fixed}
body:not(.native) .mask,body:not(.native) .drawer{position:absolute}
</style>
</head>
<body>
<div class="app">

  <aside class="side" id="side">
    <button class="newchat" id="newChat"><i data-ic="edit" data-sz="15"></i>新对话</button>
    <div class="sess-list" id="sessList"></div>
    <div class="user-card" id="userCard"><div class="av">?</div><div><div class="n">未登录</div><div class="r">请在设置中登录</div></div></div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="icon-btn" id="sideBtn" data-ic="menu" data-sz="18"></button>
      <span class="name">智享AI</span>
      <div class="rt">
        <span class="pulse-dot off" id="connDot" title="未连接"></span>
        <button class="icon-btn" id="themeBtn" data-ic="moon" data-sz="17"></button>
        <button class="icon-btn" id="setBtn" data-ic="sliders" data-sz="17"></button>
        <div class="winbtns">
          <button class="winbtn" onclick="winCtl('minimize')" title="最小化"><i data-ic="wmin" data-sz="14"></i></button>
          <button class="winbtn" onclick="winCtl('maximize')" title="最大化 / 还原"><i data-ic="wmax" data-sz="13"></i></button>
          <button class="winbtn close" onclick="winCtl('close')" title="关闭"><i data-ic="x" data-sz="14"></i></button>
        </div>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-col" id="chatCol"></div>
    </div>

    <div class="input-zone">
      <div class="input-box">
        <textarea id="txt" rows="1" placeholder="给智享AI发消息…"></textarea>
        <button class="send" id="send" data-ic="send" data-sz="16"></button>
      </div>
      <div class="hint">读操作自动执行 · 写操作需你确认 · 全程审计留痕</div>
    </div>
  </div>
</div>

<!-- 设置抽屉 -->
<div class="mask" id="mask" onclick="closeSet()"></div>
<aside class="drawer" id="drawer">
  <div class="dr-hd">设置 <button class="icon-btn x" data-ic="x" data-sz="16" onclick="closeSet()"></button></div>
  <div class="dr-bd">
    <div class="dr-sec">账 号 与 连 接</div>
    <div class="dr-row"><span class="k">AI 底座</span><input class="dr-input v" id="cfgServer" placeholder="https://saas.onepan.cn/ai-api"></div>
    <div class="dr-row"><span class="k">认证中心</span><input class="dr-input v" id="cfgAuth" placeholder="https://api.onepan.cn"></div>
    <div class="dr-row"><span class="k">账 号</span><input class="dr-input v" id="cfgUser" placeholder="管理系统账号"></div>
    <div class="dr-row"><span class="k">密 码</span><input class="dr-input v" id="cfgPass" type="password" placeholder="••••••••"></div>
    <button class="loginbtn" id="loginBtn">登 录</button>
    <div class="dr-row" style="margin-top:8px"><span class="k">状 态</span><span class="badge off" id="loginState">未登录</span></div>

    <div class="dr-sec">模 型</div>
    <div id="modelList"><div class="model"><div><div class="nm">登录后加载可用模型</div><div class="sz">GET /api/chat/models</div></div></div></div>

    <div class="dr-sec">安 全</div>
    <div class="lockcard g"><b><i data-ic="lock" data-sz="13"></i>写全审核（强制）</b>所有写入需你确认后执行，无法关闭，全程审计留痕。</div>
    <div class="lockcard b"><b><i data-ic="cloudoff" data-sz="13"></i>身份说明</b>登录凭据仅保存在本机（localStorage），对话经 AI 底座完成，业务数据不落第三方。</div>
  </div>
</aside>
<div class="toast" id="toastEl"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ═══ SVG 图标库（Lucide 风格 · 1.7 描边 · currentColor） ═══ */
const IC={
menu:'<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/>',
moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
sliders:'<line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/><line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/><line x1="21" y1="20" x2="16" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/><line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/>',
edit:'<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L13 14l-4 1 1-4z"/>',
briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>',
chart:'<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',

const ic=(n,s=16,f=0)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="${f?'none':'currentColor'}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;
$$('[data-ic]').forEach(el=>el.innerHTML=ic(el.dataset.ic,+(el.dataset.sz||16),+(el.dataset.f||0)));

function toast(t){const e=$('#toastEl');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}

/* ═══ 无边框窗口控制：Electron 走 preload 桥，浏览器降级 toast ═══ */
function winCtl(a){
  if(window.zxqlWindow&&window.zxqlWindow[a])return window.zxqlWindow[a]();
  toast({minimize:'最小化 · 无边框实机中由系统执行',maximize:'最大化 / 还原 · 无边框实机中由系统执行',close:'关闭 · 无边框实机中由系统执行'}[a]||a);
}

/* ════════════════════════════════════════════════════════════
   真实对接层 —— AI 底座 /api/chat（SSE）+ 管理系统登录（JWT）
   ════════════════════════════════════════════════════════════ */
const store={get(k,d){try{const v=localStorage.getItem('zxai.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('zxai.'+k,JSON.stringify(v))}catch(e){}}};
const S={
  token:store.get('token',''),
  user:store.get('user',null),
  server:store.get('server','https://saas.onepan.cn/ai-api'),
  auth:store.get('auth','https://api.onepan.cn'),
  model:store.get('model',''),
  sessions:store.get('sessions',[]),
  cur:store.get('cur',null)
};
const isElectron=navigator.userAgent.toLowerCase().includes('electron');
if(isElectron)document.body.classList.add('native');

function saveS(){store.set('sessions',S.sessions);store.set('cur',S.cur)}

async function api(path,opt={}){
  const r=await fetch(S.server+path,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.token,...(opt.headers||{})}});
  if(r.status===401){S.token='';store.set('token','');updateUserCard();throw new Error('登录已失效，请在设置中重新登录')}
  return r.json();
}

/* ── 登录 / 状态 ── */
function logged(){return !!S.token}
function updateUserCard(){
  const c=$('#userCard');
  if(logged()&&S.user){
    const n=S.user.realName||S.user.username||'用户';
    c.innerHTML=`<div class="av">${esc(n[0])}</div><div><div class="n">${esc(n)}</div><div class="r">${esc(S.user.tenantId?('租户 '+S.user.tenantId):'已登录')}</div></div>`;
  }else{
    c.innerHTML='<div class="av">?</div><div><div class="n">未登录</div><div class="r">请在设置中登录</div></div>';
  }
  $('#connDot').classList.toggle('off',!logged());
  $('#connDot').title=logged()?'已连接 · '+(S.user?S.user.username:''):'未连接';
  const st=$('#loginState');
  if(logged()){st.textContent='已登录';st.className='badge on'}else{st.textContent='未登录';st.className='badge off'}
}
async function login(){
  const u=$('#cfgUser').value.trim(),p=$('#cfgPass').value.trim();
  if(!u||!p)return toast('请输入账号和密码');
  S.server=($('#cfgServer').value.trim().replace(/\/+$/,''))||S.server;
  S.auth=($('#cfgAuth').value.trim().replace(/\/+$/,''))||S.auth;
  store.set('server',S.server);store.set('auth',S.auth);
  const btn=$('#loginBtn');btn.textContent='登录中…';btn.disabled=true;
  try{
    const r=await fetch(S.auth+'/api/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const j=await r.json().catch(()=>({}));
    const d=j.data||j;
    if(!r.ok||!d.token)throw new Error(j.msg||j.message||('HTTP '+r.status));
    S.token=d.token;S.user=d.user||null;
    store.set('token',S.token);store.set('user',S.user);
    $('#cfgPass').value='';
    toast('登录成功，欢迎 '+((S.user&&(S.user.realName||S.user.username))||''));
    greet();updateUserCard();loadModels();pullPending();
  }catch(e){toast('登录失败：'+e.message)}
  btn.textContent='登 录';btn.disabled=false;
}
function logout(){
  S.token='';S.user=null;store.set('token','');store.set('user',null);
  updateUserCard();toast('已退出登录');
}

/* ── 会话管理（本地列表 + conversationId 续聊） ── */
function newSession(){
  S.cur={id:null,title:'新对话',ts:Date.now(),msgs:[]};
  S.sessions.unshift(S.cur);saveS();renderSessions();renderMsgs();
}
function curSession(){if(!S.cur)newSession();return S.cur}
function selectSession(i){
  S.cur=S.sessions[i];saveS();renderSessions();renderMsgs();
}
function renderSessions(){
  const el=$('#sessList');
  el.innerHTML=S.sessions.map((s,i)=>`<div class="sess ${S.cur===s?'on':''}"><i></i>${esc(s.title||'新对话')}</div>`).join('');
  el.querySelectorAll('.sess').forEach((n,i)=>{n.querySelector('i').innerHTML=ic('msg',14);n.onclick=()=>selectSession(i)});
}
function renderMsgs(){
  const col=$('#chatCol');col.innerHTML='';
  const s=curSession();
  if(s.msgs.length===0){greetLine();return}
  for(const m of s.msgs){
    if(m.r==='u')userEl(m.t);
    else{const b=aiEl();b.textContent=m.t}
  }
  const d=document.createElement('div');d.className='divider';d.innerHTML=`<i>${ic('msg',12)}</i><span>对话内容</span>`;col.appendChild(d);
  end();
}
function greetLine(){
  const b=aiEl();
  b.innerHTML=logged()
    ?`你好，${esc((S.user&&(S.user.realName||S.user.username))||'')}，我是智享AI。直接说要办的事，例如「查询五粮液库存」「给客户开一张销售单」。`
    :'欢迎使用智享AI。请先点右上角 <b>设置</b>，填入管理系统账号登录后即可开始对话。';
}

/* ── 基础消息渲染 ── */
const col=$('#chatCol'),sc=$('#chatScroll');
const end=()=>sc.scrollTop=sc.scrollHeight;
function userEl(t){const d=document.createElement('div');d.className='m-user';d.textContent=t;col.appendChild(d);end();return d}
function aiEl(){const d=document.createElement('div');d.className='m-ai';d.innerHTML=`<div class="av">${ic('sparkle',15,1)}</div><div class="bd"><span class="body"></span></div>`;col.appendChild(d);end();return d.querySelector('.body')}
function aiBody(){return aiEl().parentElement.querySelector('.bd')}
async function say(t){const b=aiEl();b.textContent=t;end();return b}

/* 时间线 */
function tlHost(b){
  let h=b.querySelector('.tl:last-child');
  if(!h){h=document.createElement('div');h.className='tl';h.innerHTML=`<div class="tl-sum"><span class="s">正在处理…</span></div><div class="tl-items"></div>`;b.appendChild(h);end()}
  return h;
}
function tlAdd(b,tool){
  const h=tlHost(b);const list=h.querySelector('.tl-items');
  const it=document.createElement('div');it.className='tl-item';
  it.innerHTML=`<span class="spin"></span><span>${esc(tool)}</span>`;
  list.appendChild(it);
  h.querySelector('.tl-sum').innerHTML=`<span class="spin"></span><span class="s">正在处理…</span>`;end();
  return it;
}
function tlDone(b,it,ok,label){
  if(!it)return;
  it.classList.add(ok?'done':'fail');
  it.querySelector('.spin')?.remove();
  it.querySelector('span:last-child').outerHTML=`<span class="t">${esc(label||'')}</span>`;
}
function tlFinish(b,ok){
  const h=b.querySelector('.tl:last-child');if(!h)return;
  h.querySelector('.tl-sum').innerHTML=ok
    ?`<span class="ok">${ic('check',12)}</span><span class="s">处理完成</span><span class="arr">${ic('chev',11)}</span>`
    :`<span style="color:var(--red)">${ic('alert',12)}</span><span class="s">部分失败 · 点击查看</span><span class="arr">${ic('chev',11)}</span>`;
  h.onclick=()=>h.classList.toggle('open');
}

/* 写确认卡（真实 R70-15 确认机制） */
function showConfirm(host,token,preview,expireAt){
  const b=host.classList&&host.classList.contains('bd')?host:aiBody();
  const c=document.createElement('div');c.className='confirm';
  const det=preview&&preview.details?Object.entries(preview.details):[];
  const rows=det.map(([k,v])=>`<tr><td class="k">${esc(k)}</td><td class="${/金额|合计|总价/.test(k)?'amt':''}">${esc(String(v))}</td></tr>`).join('');
  c.innerHTML=`<div class="hd">${ic('alert',15)} ${esc((preview&&preview.operation)||'写操作确认')}<span class="timer">--:--</span></div>
  ${preview&&preview.summary?`<div class="sum">${esc(preview.summary)}</div>`:''}
  ${rows?`<table>${rows}</table>`:''}
  <div class="bar"><i style="width:100%"></i></div>
  <div class="note">${ic('lock',12)} 写全审核 · 确认后执行，全程留痕${preview&&preview.reviewRequired?' · 需人工复核':''}</div>
  <div class="acts"><button class="b1 btn">取消</button><button class="b3 btn pri">确认执行</button></div>`;
  b.appendChild(c);end();
  const total=Math.max(5,Math.floor(((expireAt||Date.now()+300000)-Date.now())/1000));let left=total;
  const tm=c.querySelector('.timer'),bar=c.querySelector('.bar i');
  const iv=setInterval(()=>{left--;tm.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;bar.style.width=(left/total*100)+'%';
    if(left<=0){clearInterval(iv);c.classList.add('dead');tm.textContent='已失效'}},1000);
  c.querySelector('.b1').onclick=async()=>{
    clearInterval(iv);c.querySelector('.acts').remove();
    try{await api('/chat/confirmations/'+encodeURIComponent(token)+'/cancel',{method:'POST'})}catch(e){}
    c.remove();say('已取消。');
  };
  c.querySelector('.b3').onclick=async function(){
    clearInterval(iv);this.textContent='执行中…';this.disabled=true;
    let r;try{r=await api('/chat/confirmations/'+encodeURIComponent(token)+'/confirm',{method:'POST',body:'{}'})}catch(e){r={success:false,error:e.message}}
    if(r.needsSecondConfirm){this.textContent='高危 · 再次确认';this.disabled=false;
      c.querySelector('.note').innerHTML=`${ic('alert',12)} 高危操作：请再次点击「确认执行」`;end();return}
    if(r.success){
      c.classList.add('ok');
      c.querySelector('.hd').innerHTML=`${ic('check',15)} 已执行`;
      c.querySelector('.bar').remove();tm.remove();
      c.querySelector('.note').innerHTML=`${ic('file',12)} 已写入系统 · 审计留痕${r.operationId?(' · 3 分钟内可撤销（'+r.operationId+'）'):''}`;
      c.querySelector('.acts').remove();end();
    }else{
      this.textContent='确认执行';this.disabled=false;
      toast('执行失败：'+(r.error||'未知错误'));
    }
  };
}

/* 澄清卡 */
function showClarify(b,questions){
  const d=document.createElement('div');d.className='clarify';
  const qs=(questions||[]).map(q=>q.question||q.message).filter(Boolean);
  d.innerHTML=qs.map(q=>`<div class="q">${esc(q)}</div>`).join('')+`<div class="opts">${qs.map(q=>`<button class="opt">${esc(q)}</button>`).join('')}</div>`;
  b.appendChild(d);end();
  d.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{d.remove();go(o.textContent)});
}

/* ── 对话主流程（真实 SSE） ── */
let busy=false;
async function go(t){
  if(!t.trim()||busy)return;
  if(!logged()){toast('请先在设置中登录');$('#setBtn').click();return}
  busy=true;$('#send').disabled=true;
  userEl(t);
  const sess=curSession();sess.msgs.push({r:'u',t});
  if(sess.title==='新对话'){sess.title=t.slice(0,20);renderSessions()}
  const b=aiEl();b.classList.add('typing');
  const bd=b.parentElement.querySelector('.bd');
  const tlMap={};let toolCount=0,toolFail=0;
  try{
    const r=await fetch(S.server+'/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'text/event-stream','Authorization':'Bearer '+S.token},
      body:JSON.stringify({message:t,conversationId:sess.id||undefined,model:S.model||undefined})
    });
    if(!r.ok){
      const j=await r.json().catch(()=>({}));
      if(r.status===401||j.code==='AI_001'){
        // 登录过期：清死 token + 刷新登录卡片 + 自动打开设置抽屉引导重登（2026-09-05 鉴权收紧后必现路径）
        S.token='';store.set('token','');
        updateUserCard();
        try{$('#setBtn').click()}catch(e){}
        throw new Error('登录已过期，请在设置中重新登录后再试');
      }
      throw new Error(j.message||j.msg||('HTTP '+r.status));
    }
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        for(const line of chunk.split('\n')){
          if(!line.startsWith('data:'))continue;
          let ev;try{ev=JSON.parse(line.slice(5).trim())}catch(e){continue}
          switch(ev.type){
            case 'text':
              b.textContent+=ev.content||'';end();break;
            case 'tool_start':
              toolCount++;tlMap[ev.tool]=tlAdd(bd,ev.tool);break;
            case 'tool_result':{
              const it=tlMap[ev.tool]||tlAdd(bd,ev.tool);
              if(ev.success===false)toolFail++;
              tlDone(bd,it,ev.success!==false,ev.success===false?'失败':'完成');
              break}
            case 'pending_write':
              b.classList.remove('typing');
              showConfirm(bd,ev.token,ev.preview,ev.expireAt);break;
            case 'await_confirm':break;
            case 'clarify':
              b.classList.remove('typing');showClarify(bd,ev.questions);break;
            case 'agent_step':
            case 'review_required':{
              const s=ev.stage||ev.label||ev.message||ev.type;
              tlDone(bd,tlAdd(bd,s),true,'');break}
            case 'done':
              sess.id=ev.conversationId||sess.id;
              if(ev.usage){const u=ev.usage;const d=document.createElement('div');d.className='usage-line';d.style.cssText='font-size:11px;color:var(--sub);opacity:.75;margin-top:6px';d.textContent=`${u.totalTokens||0} tokens · ${(u.latencyMs/1000||0).toFixed(1)}s · ${u.iterations||0} 轮`;bd.appendChild(d)}
              break;
            case 'error':
              b.textContent+=(b.textContent?'\n':'')+'⚠ '+(ev.message||'服务异常');
              b.style.color='var(--red)';break;
            default:break;
          }
        }
      }
    }
  }catch(e){
    b.textContent+=(b.textContent?'\n':'')+'⚠ '+e.message;b.style.color='var(--red)';
  }
  b.classList.remove('typing');
  if(toolCount)tlFinish(bd,toolFail===0);
  sess.msgs.push({r:'a',t:b.textContent||'（无文本回复）'});
  saveS();end();
  busy=false;$('#send').disabled=false;
}

/* 模型列表（真实） */
async function loadModels(){
  if(!logged())return;
  try{
    const j=await api('/chat/models');
    if(!S.model||!j.models.some(m=>m.value===S.model))S.model=j.default;
    store.set('model',S.model);
    const ml=$('#modelList');
    ml.innerHTML=j.models.map(m=>`<div class="model" data-v="${esc(m.value)}"><div><div class="nm">${esc(m.label)}</div><div class="sz">${m.type==='builtin'?'内置模型':'外部模型'}</div></div><span class="tag ${m.value===S.model?'on':''}">${m.value===S.model?'使用中':'选择'}</span></div>`).join('');
    ml.querySelectorAll('.model').forEach(el=>el.onclick=()=>{S.model=el.dataset.v;store.set('model',S.model);loadModels();toast('已切换模型：'+el.dataset.v)});
  }catch(e){/* 静默：模型列表非关键 */}
}

/* 登录后拉取待确认写操作（AI 主动提醒） */
async function pullPending(){
  if(!logged())return;
  try{
    const j=await api('/chat/confirmations');
    if(j&&j.total>0){
      const b=aiBody();
      b.textContent=`你有 ${j.total} 项待确认的写操作，请处理：`;
      for(const it of j.items)showConfirm(b,it.confirmationId,it.preview,new Date(it.expiresAt).getTime());
    }
  }catch(e){/* 静默 */}
}

/* ── 事件绑定 ── */
$('#sideBtn').onclick=()=>$('#side').classList.toggle('hide');
$('#newChat').onclick=newSession;
$('#themeBtn').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('#themeBtn').innerHTML=ic(d?'moon':'sun',17)};
$('#setBtn').onclick=()=>{$('#drawer').classList.add('show');$('#mask').classList.add('show')};
function closeSet(){$('#drawer').classList.remove('show');$('#mask').classList.remove('show')}
$('#loginBtn').onclick=login;
$('#cfgPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

const txt=$('#txt');
$('#send').onclick=()=>{const t=txt.value;txt.value='';txt.style.height='auto';go(t)};
txt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=txt.value;txt.value='';txt.style.height='auto';go(t)}});
txt.addEventListener('input',()=>{txt.style.height='auto';txt.style.height=Math.min(txt.scrollHeight,120)+'px'});

/* ── 初始化 ── */
$('#cfgServer').value=S.server;$('#cfgAuth').value=S.auth;$('#cfgUser').value='';
if(S.sessions.length===0)newSession();else{S.cur=S.sessions.find(s=>s===S.cur)||S.sessions[0];renderSessions();renderMsgs()}
updateUserCard();
if(logged()){greet();loadModels();pullPending()}
function greet(){if(curSession().msgs.length===0)renderMsgs()}
</script>
