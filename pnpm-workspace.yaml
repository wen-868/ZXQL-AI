packages:
  - .
allowBuilds:
  unrs-resolver: true
  "@napi-rs/canvas": true
# 注意：下面这组 overrides 同时声明在 package.json 的 pnpm.overrides（镜像），
# 用于兼容 pnpm 9（生产环境 pnpm 9.15.9 只读 package.json，不读本文件）。
# 改动任一处必须两处同步，否则 pnpm install --frozen-lockfile 会报
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH。
overrides:
  fast-uri: ^3.1.8
  "@napi-rs/canvas": ^0.1.85
  # 2026-09-05 依赖通告整改：qs<6.16.0 两条 moderate（数组上限绕过/isBuffer DoS，express 链路）、
  # @xmldom/xmldom<=0.8.14 一条 moderate（XML 片段注入，mammoth/RAG 文档解析链路）
  qs: ^6.16.0
  "@xmldom/xmldom": ^0.8.15
  # R101-AI-18（2026-10-10）依赖通告整改（审查报告 §1.1），逐条对账见 docs/reports/R101-AI-18-回传.md：
  #   proxy-addr 2.0.7 → critical：IPv4-mapped IPv6 信任子网绕过，正打在 main.ts:38
  #     `trust proxy: 'loopback'` 的信任边界上（express 5 传递依赖）
  #   multer 2.2.0 → high×3：multipart 字段名 DoS / 中止上传 fd 泄漏（@nestjs/platform-express 传递）
  #   handlebars 4.7.9 → critical×2：AST 类型混淆导致 JS 注入（ts-jest 传递，仅测试链）
  #   js-yaml 3.15.0 / 4.3.0 → high×4：!!omap / merge keys 的 CPU 放大
  #   brace-expansion 1.1.18 / 2.1.4 / 5.0.9 → high×6：嵌套花括号导致栈耗尽 DoS
  #   fast-uri 3.1.5 → high×5：IDN/百分号编码主机混淆 + authority 注入 ⇒ 由 ^3.1.5 提到 ^3.1.8
  proxy-addr: ^2.0.8
  multer: ^2.3.0
  handlebars: ^4.7.10
  "js-yaml@3": ^3.15.2
  "js-yaml@4": ^4.3.2
  "brace-expansion@1": ^1.1.21
  "brace-expansion@2": ^2.1.7
  "brace-expansion@5": ^5.0.12
  #   sprintf-js 1.0.3 → moderate：**升不动**——通告要求 >=1.1.4，但上游最新发布仅
  #     1.1.3（2026-10-10 实测 `pnpm view sprintf-js versions`）⇒ 无法加 override。
  #     仅经 argparse@1 两条链可达（mammoth 文档解析 / jest 工具链），属 DoS 面，
  #     待上游发版后再补；见回传卡「升不动清单」。
